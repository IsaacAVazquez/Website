version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # typescript-eslint's peer range stops below TypeScript 6.1, so a TypeScript 7
    # bump cannot install. #603 merged on 2026-11-03 and #677 put it back. Drop
    # this once typescript-eslint accepts 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      testing:
        patterns:
          - "jest"
          - "@testing-library/*"
          - "@playwright/*"
          - "playwright"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
  # The investments fetch pins defeatbeta-api, whose version is tied to the
  # layout of the dataset it reads. The pin went stale on 2026-09-15 and the
  # lane was down for twelve days before anyone saw why.
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # defeatbeta-api caps ipython at 8.37.0 and pins duckdb exactly, and pydantic
    # pins pydantic-core exactly, so a bump to any of them alone cannot install.
    # CI installs none of the Python requirements, so those PRs go green anyway
    # (#605 merged on 2026-11-03 and #677 put ipython back).
    ignore:
      - dependency-name: "ipython"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-core"
      - dependency-name: "duckdb"
