name: Refresh GitHub Trending Snapshot

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-github-trending
  cancel-in-progress: false

jobs:
  refresh-github-trending:
    name: Refresh GitHub Trending Snapshot
    # The builder reads GITHUB_TOKEN from the inherited secrets for a higher
    # Search API rate limit.
    uses: ./.github/workflows/refresh-snapshot.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      id: github-trending
      snapshot-path: src/data/githubTrendingSnapshot.json
      label: github-trending-refresh-failure
      title: GitHub Trending refresh failed
