name: Refresh Formula 1 Snapshot

on:
  # Refresh every three hours from Thursday through Sunday and once daily Monday
  # through Wednesday. OpenF1 needs no token.
  schedule:
    - cron: "10 */3 * * 0,4,5,6"
    - cron: "10 8 * * 1-3"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: refresh-formula-1
  cancel-in-progress: false

jobs:
  refresh-formula-1:
    name: Refresh Formula 1 Snapshot
    uses: ./.github/workflows/refresh-snapshot.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      id: formula-1
      snapshot-path: src/data/formula1Snapshot.json
      label: formula-1-refresh-failure
      title: Formula 1 refresh failed
