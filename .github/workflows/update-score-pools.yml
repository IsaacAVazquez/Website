name: Refresh Score Pools Snapshot

on:
  # Four passes a day keeps odds history granular enough to read line
  # movement without burning The Odds API quota. Results and standings ride
  # along on the same runs.
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: refresh-score-pools
  cancel-in-progress: false

jobs:
  refresh-score-pools:
    name: Refresh Score Pools Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      # A missing key is a lane that was never switched on, which is a different
      # thing from a provider that failed. It failed all 268 runs from July 20 to
      # September 27, 2026 as if it were the second, and a lane that is always
      # red teaches everyone to stop looking. With the keys set, a provider
      # failure still fails the run and opens the issue.
      - name: Check provider configuration
        id: config
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -z "$THE_ODDS_API_KEY" ] || [ -z "$API_FOOTBALL_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Score pools is not configured. Set the THE_ODDS_API_KEY and API_FOOTBALL_KEY repository secrets to turn the refresh on. The page shows sample data until then."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Refresh score-pools snapshot
        if: steps.config.outputs.configured == 'true'
        timeout-minutes: 12
        run: npm run update:score-pools
        env:
          NODE_ENV: production
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Verify score-pools snapshot quality
        id: verify_quality
        if: steps.config.outputs.configured == 'true'
        run: npx tsx scripts/verifyScorePoolsSnapshot.ts

      - name: Verify refresh freshness
        if: steps.config.outputs.configured == 'true'
        run: npx tsx scripts/verifyDataRefresh.ts score-pools

      - name: Check for snapshot changes
        id: check_changes
        if: steps.config.outputs.configured == 'true'
        run: |
          if [ -z "$(git status --porcelain -- src/data/scorePoolsSnapshot.ts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in src/data/scorePoolsSnapshot.ts"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in src/data/scorePoolsSnapshot.ts"
          fi

      - name: Commit and push refreshed snapshot
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: refresh score pools snapshot [automated] [skip ci]" \
            src/data/scorePoolsSnapshot.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create job summary
        if: always()
        env:
          LEAGUES: ${{ steps.verify_quality.outputs.leagues }}
          FIXTURES: ${{ steps.verify_quality.outputs.fixtures }}
          ODDS: ${{ steps.verify_quality.outputs.odds }}
        run: |
          echo "## Score Pools Snapshot Refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "**Schedule:** Every 6 hours" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$LEAGUES" ]; then
            echo "**Leagues:** $LEAGUES" >> "$GITHUB_STEP_SUMMARY"
            echo "**Fixtures:** $FIXTURES" >> "$GITHUB_STEP_SUMMARY"
            echo "**Odds snapshots:** $ODDS" >> "$GITHUB_STEP_SUMMARY"
            echo "**Live leagues:** ${{ steps.verify_quality.outputs.live_leagues }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Live fixtures:** ${{ steps.verify_quality.outputs.live_fixtures }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Live odds snapshots:** ${{ steps.verify_quality.outputs.live_odds }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.config.outputs.configured }}" != "true" ]; then
            echo "Not configured. The provider keys are not set, so nothing was refreshed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "Score-pools snapshot changed and was committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Score-pools snapshot was already up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify on failure via GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').open({ github, context }, 'score-pools-refresh-failure', 'Score-pools refresh failed')

      - name: Close resolved failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').close({ github, context }, 'score-pools-refresh-failure')
