name: Audit Curated Data

on:
  schedule:
    - cron: "25 15 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # The step may fail so the review issue can be written first. The last
      # step fails the run, so an overdue dataset never shows as a green check.
      - name: Audit review dates and structure
        id: audit
        continue-on-error: true
        run: npx tsx scripts/auditCuratedData.ts --markdown="$RUNNER_TEMP/curated-audit.md"

      - name: Open or update curated data review
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const title = "Curated datasets need review";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const reportPath = `${process.env.RUNNER_TEMP}/curated-audit.md`;
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, "utf8")
              : "The audit failed before it wrote a report.";
            // The issue body holds the latest report. A weekly comment that
            // carried only a run link told nobody which dataset was overdue.
            const body = `${report}\nRun: ${runUrl}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "curated-data-review",
              per_page: 1,
            });
            if (existing.data[0]) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["curated-data-review", "automation"],
              });
            }

      - name: Close resolved curated data review
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "curated-data-review",
              per_page: 10,
            });
            for (const issue of existing.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

      - name: Fail the run while a dataset needs review
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::One or more curated datasets are overdue or structurally invalid. The review issue carries the report."
          exit 1
