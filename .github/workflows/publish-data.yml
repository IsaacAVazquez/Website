name: Publish Refreshed Data

# Production is built here rather than on Netlify. The account is on the free tier
# with 300 build minutes a month, and it ran out on 2026-08-06 with the limit
# enforced, so every git-triggered build after that returned "Skipped due to
# account builds usage exceeded" and committed snapshots stopped reaching
# production entirely. This repository is public, so GitHub Actions minutes are
# free and unmetered, and a deploy run from this runner does not consume build
# minutes because the build never ran on Netlify's infrastructure. Moving the
# build here makes the 300-minute cap irrelevant instead of something to
# ration. `scripts/ci/netlify-ignore.sh` stops Netlify
# from also building main, which would duplicate every deploy and race this
# upload.
#
# Publication is still batched rather than fired once per snapshot refresh.
# Sixteen refresh workflows on schedules as tight as every three hours were each
# triggering their own build, which reached roughly 80 builds a week against 20
# real pushes. The refresh commits carry [skip ci], so they do not trigger the
# push event below and instead accumulate until the next scheduled run. Data can
# sit committed for up to six hours before it is live, so use workflow_dispatch
# to publish immediately when something needs to ship now.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: publish-refreshed-data
  # Not cancel-in-progress. Killing a build hook mid-flight was harmless, but
  # killing a deploy part way through its upload is not.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      # An identifier rather than a credential, and useless without
      # NETLIFY_AUTH_TOKEN. Netlify documents it as public configuration.
      NETLIFY_SITE_ID: 212e9ee7-84c6-4db8-96f0-68780170c289

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          # Enough history for the verifier to recognize a newer snapshot commit
          # that lands while the deploy is being published.
          fetch-depth: 100

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Compute expected committed data revision
        id: ledger
        run: |
          echo "revision=$(npx tsx scripts/printDataLedgerRevision.ts)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and deploy the production bundle
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is required to build and publish production."
            exit 1
          fi
          # One command, rather than `netlify build` followed by a separate
          # `deploy --no-build`. @netlify/plugin-nextjs publishes the site by
          # swapping .netlify/static into the publish directory in its
          # onPostBuild hook and swapping it back out again in onEnd. A
          # standalone `netlify build` runs that entire lifecycle, so .next holds
          # the raw Next.js output again by the time a separate deploy step reads
          # it, and the deploy uploads build artifacts at the site root while
          # every /_next/static URL 404s. That shipped on 2026-08-20 and served
          # an unstyled site until it was rolled forward. `deploy` builds by
          # default, which keeps the upload inside the lifecycle where the swap
          # still holds.
          #
          # Building here rather than running `npm run build` also picks up the
          # site's own environment variables, including
          # NEXT_PUBLIC_GA_MEASUREMENT_ID, which exists only in that environment.
          # None of this reaches the metered build system: what keeps the deploy
          # off Netlify's build minutes is running on this runner at all, not any
          # particular flag.
          npx --yes netlify-cli@26.1.0 deploy \
            --prod \
            --context production \
            --message "Publish data ledger ${{ steps.ledger.outputs.commit }}"

      - name: Verify the complete ledger
        env:
          EXPECTED_REVISION: ${{ steps.ledger.outputs.revision }}
          EXPECTED_COMMIT: ${{ steps.ledger.outputs.commit }}
          PRODUCTION_DATA_REVISION_URL: ${{ secrets.PRODUCTION_DATA_REVISION_URL }}
        run: |
          revision_url="${PRODUCTION_DATA_REVISION_URL:-https://isaacvazquez.com/api/data-revisions}"
          # The third argument is the build hook, and it is deliberately empty
          # because the deploy above is already published and there is nothing
          # left to trigger.
          node scripts/ci/ensure-production-data-ledger.mjs \
            "$EXPECTED_REVISION" "$revision_url" "" "$EXPECTED_COMMIT"

      - name: Verify the homepage stylesheet resolves
        env:
          SITE_URL: ${{ secrets.PRODUCTION_URL || 'https://isaacvazquez.com' }}
        run: |
          # The ledger check above passes on a broken publish, because
          # /api/data-revisions is served by the Next.js function whether or not
          # the static assets ever uploaded. That is how the 2026-08-20 deploy
          # reported success while serving an unstyled site, and this step exists
          # to catch that shape of failure.
          #
          # It reports rather than fails when it cannot see the site. Only a
          # homepage that loads and names a stylesheet that then 404s is treated
          # as broken, because that is unambiguous.
          #
          # The agent string matters. An earlier version of this step spoofed
          # Chrome, and Cloudflare answered 403 to a datacenter IP claiming to be
          # a browser, which made the step warn and skip on every run. The ledger
          # step above reaches the same host from the same runner with its own
          # plain agent string, so this one matches it.
          ua="WebsiteDeployAssetCheck/1.0"
          home=$(curl -sS -m 30 -A "$ua" -w '\n%{http_code}' "$SITE_URL/" || true)
          code=$(printf '%s' "$home" | tail -1)
          if [ "$code" != "200" ]; then
            echo "::warning::$SITE_URL/ returned '$code' from this runner, so the published assets were not checked."
            exit 0
          fi
          css=$(printf '%s' "$home" | grep -oE '/_next/static/css/[^"]+\.css' | head -1)
          if [ -z "$css" ]; then
            echo "::warning::No stylesheet link found in the homepage, so the published assets were not checked."
            exit 0
          fi
          code=$(curl -sS -m 30 -A "$ua" -o /dev/null -w '%{http_code}' "$SITE_URL$css" || true)
          if [ "$code" = "200" ]; then
            echo "Stylesheet $css served with HTTP $code."
          elif [ "$code" = "404" ]; then
            echo "::error::Stylesheet $css is missing from the deploy (HTTP 404). The deploy most likely published the raw .next directory instead of the plugin's static output."
            exit 1
          else
            echo "::warning::Stylesheet $css returned '$code', which does not clearly indicate a bad deploy."
          fi

      - name: Open or update publication incident
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Production data publication failed";
            const body = `The refreshed data ledger did not reach production.\n\nRun: ${runUrl}\n\nCheck the build and deploy steps first, then NETLIFY_AUTH_TOKEN, the Netlify deploy log, and the access policy for /api/data-revisions.`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "data-publication-failure",
              per_page: 5,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["data-publication-failure", "automation"],
              });
            }

      - name: Close resolved publication incidents
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "data-publication-failure",
              per_page: 20,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Production now serves the expected data ledger revision. Closing this incident.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
