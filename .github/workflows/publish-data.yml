name: Publish Refreshed Data

# Publication is batched rather than fired once per snapshot refresh. Sixteen refresh
# workflows on schedules as tight as every three hours were each triggering their own
# Netlify build, which reached roughly 80 builds a week against 20 real pushes and
# exhausted the account's build minutes. Every deploy from 2026-08-06 onward was
# skipped as a result, so committed data stopped reaching production entirely.
#
# The scheduled runs below publish whatever has landed since the last one, which the
# ledger check already handles because it compares production against the committed
# revision rather than against any single refresh. The tradeoff is that data can now
# sit committed for up to six hours before it is live. Use workflow_dispatch to
# publish immediately when something needs to ship now.
on:
  schedule:
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:

concurrency:
  group: publish-refreshed-data
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          # Enough history for the verifier to recognize a newer snapshot commit
          # that lands while Netlify is starting the branch build.
          fetch-depth: 100

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Compute expected committed data revision
        id: ledger
        run: |
          echo "revision=$(npx tsx scripts/printDataLedgerRevision.ts)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish and verify the complete ledger
        env:
          EXPECTED_REVISION: ${{ steps.ledger.outputs.revision }}
          EXPECTED_COMMIT: ${{ steps.ledger.outputs.commit }}
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          PRODUCTION_DATA_REVISION_URL: ${{ secrets.PRODUCTION_DATA_REVISION_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK is required for data publication."
            exit 1
          fi
          revision_url="${PRODUCTION_DATA_REVISION_URL:-https://isaacvazquez.com/api/data-revisions}"
          node scripts/ci/ensure-production-data-ledger.mjs \
            "$EXPECTED_REVISION" "$revision_url" "$NETLIFY_BUILD_HOOK" \
            "$EXPECTED_COMMIT"

      - name: Open or update publication incident
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Production data publication failed";
            const body = `The refreshed data ledger did not reach production.\n\nRun: ${runUrl}\n\nCheck the Netlify build hook, production deploy log, and access policy for /api/data-revisions.`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "data-publication-failure",
              per_page: 5,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["data-publication-failure", "automation"],
              });
            }

      - name: Close resolved publication incidents
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "data-publication-failure",
              per_page: 20,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Production now serves the expected data ledger revision. Closing this incident.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
