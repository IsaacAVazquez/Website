name: Refresh MLB Snapshot

on:
  # Every four hours from March 20 through November 6, which covers Opening
  # Day and the World Series. The old schedule ran all of March and November,
  # when the API has no standings or no games, and failed about a hundred
  # runs in each. Manual dispatch covers off-season ad hoc refreshes.
  schedule:
    - cron: "5 */4 20-31 3 *"
    - cron: "5 */4 * 4-10 *"
    - cron: "5 */4 1-6 11 *"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: refresh-mlb
  cancel-in-progress: false

jobs:
  refresh-mlb:
    name: Refresh MLB Snapshot
    uses: ./.github/workflows/refresh-snapshot.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      id: mlb
      snapshot-path: src/data/mlbSnapshot.json
      label: mlb-refresh-failure
      title: MLB refresh failed
