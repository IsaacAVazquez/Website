name: Refresh La Liga Snapshot

on:
  schedule:
    # Every four hours during the La Liga season (Aug through May). Skipped Jun/Jul
    # because the league is on summer break — no fixtures, no standings
    # changes, so the daily run would just burn minutes.
    - cron: "30 */4 * 1-5,8-12 *"
  workflow_dispatch:

# Both football lanes draw on one football-data.org token and its limit of
# 10 requests a minute. Run side by side they took each other's budget, and
# most runs skipped a club or lost the table. One group makes them take turns.
concurrency:
  group: football-data-org
  cancel-in-progress: false

jobs:
  refresh-la-liga:
    name: Refresh La Liga Snapshot
    # FOOTBALL_DATA_API_TOKEN reaches the builder through the inherited secrets.
    uses: ./.github/workflows/refresh-snapshot.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      id: la-liga
      snapshot-path: src/data/laLigaSnapshot.json
      label: la-liga-refresh-failure
      title: La Liga refresh failed
      # Cap a hung football-data.org call so we don't burn 6 hours of runner.
      timeout-minutes: 30
      refresh-timeout-minutes: 20
