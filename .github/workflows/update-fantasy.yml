name: Update Fantasy Football Snapshots

on:
  # Rankings move daily from July through December: drafts through early
  # September, then the season itself through the Week 17 championships. The
  # daily lane used to stop September 30, which left a live in-season board on
  # a weekly refresh. February through June a weekly pass is enough to catch
  # provider corrections and rollover work. The minute sits off the top of the
  # hour, where GitHub delays and drops the most scheduled runs.
  schedule:
    - cron: "17 17 * 7-12 *"
    # Weeks 17 and 18 are played in the first ten days of January.
    - cron: "17 17 1-12 1 *"
    - cron: "17 17 * 1-6 3"
    # Sunday morning in season, so the weekly board is current at kickoff. The
    # 17:17 run has started as late as 20:50 UTC, after the early games.
    - cron: "47 11 * 1,9-12 0"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: update-fantasy
  cancel-in-progress: false

jobs:
  update-fantasy-snapshots:
    name: Update Fantasy Football Snapshots
    runs-on: ubuntu-latest
    # FantasyPros scrape with retries can run long; cap at 30 min.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # The weekly board is its own soft lane. It is the only artifact that
      # changes in season, so it builds first, ahead of the two dozen FantasyPros
      # requests the draft boards make from the same address. It no-ops before
      # Week 1, and a failure here must not stop the draft boards from committing.
      - name: Build weekly board
        id: build_weekly
        continue-on-error: true
        timeout-minutes: 10
        run: npm run update:fantasy:weekly
        env:
          NODE_ENV: production

      # The redraft and best ball boards come from different upstream sources and
      # are now committed independently. They were one `npm run update:fantasy`
      # step behind one commit list, so a best-ball-only outage skipped the commit
      # for fully validated redraft rankings, which are the primary fantasy
      # surface. Redraft builds first and hard-fails the job; best ball runs as a
      # soft lane and is reported by the terminal check near the end of this job.
      - name: Build fantasy snapshots
        id: build_redraft
        # Soft like every other lane gate. Left hard, a redraft build failure made
        # the best ball step's implicit success() condition false and skipped it,
        # which is the coupling the comment above says cannot happen. The redraft
        # commit still requires verify_freshness and verify_quality to pass, and
        # the terminal report step below turns the run red.
        continue-on-error: true
        timeout-minutes: 15
        run: npm run update:fantasy:redraft
        env:
          NODE_ENV: production

      - name: Build best ball snapshot
        id: build_best_ball
        continue-on-error: true
        timeout-minutes: 10
        run: npm run update:fantasy:best-ball
        env:
          NODE_ENV: production

      # Freshness verifies the redraft artifact (ppr.json) only, so it gates
      # the redraft commit lane rather than the whole job: as a hard step it
      # sat between the builds and both commit lanes and a redraft staleness
      # failure aborted the run before a healthy best ball snapshot could
      # commit — the exact coupling the soft-lane design exists to prevent.
      # The terminal report step still turns the run red.
      - name: Verify refresh freshness
        id: verify_freshness
        continue-on-error: true
        run: npx tsx scripts/verifyDataRefresh.ts fantasy-football

      # Quality gate: a partial scrape (e.g. FantasyPros throttling some
      # positions) can produce a snapshot with mostly empty boards and slip
      # past `git diff` because the file does change. Refuse to commit unless
      # every scoring format has a healthy overall board AND every individual
      # position board (QB/RB/WR/TE/K/DST) clears the same room-completeness
      # floor as the source parser. The same gate validates every VORP board
      # the snapshot publishes (10, 12, and 14 teams) and only warns when one
      # is absent: VORP is a fail-soft overlay, so a missing board sets
      # vorp_dark for the terminal report instead of withholding validated
      # rankings. This rejects a coherent partial response before it can
      # replace a draft-ready snapshot.
      - name: Verify fantasy snapshot quality
        id: verify_quality
        # Soft for the same reason as the freshness step above: this gate
        # covers the redraft snapshots only and must not stop the best ball
        # lane. The redraft commit below requires both gates to have passed.
        continue-on-error: true
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const MIN_OVERALL = 300;
          const MIN_POSITION = { QB: 48, RB: 100, WR: 120, TE: 48, K: 32, DST: 32 };
          const MIN_VORP = 300;
          const VORP_TEAM_SIZES = ['10', '12', '14'];
          const VORP_PATHS = {
            ppr: 'ppr-vorp.php',
            half_ppr: 'half-ppr-vorp.php',
            standard: 'vorp.php',
          };
          const DATA_DIR = path.join('public', 'data', 'fantasy');
          const formats = ['ppr', 'half_ppr', 'standard'];
          const failures = [];
          const warnings = [];

          for (const format of formats) {
            const filePath = path.join(DATA_DIR, format + '.json');
            try {
              const snapshot = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              const overallCount = Array.isArray(snapshot.overall) ? snapshot.overall.length : 0;
              const positions = snapshot.positions || {};
              const counts = Object.keys(MIN_POSITION)
                .map((pos) => pos + '=' + ((positions[pos] || []).length))
                .join(' ');
              const vorpCounts = VORP_TEAM_SIZES
                .map((teamSize) => teamSize + '-team=' + ((snapshot.vorpRankings?.[teamSize] || []).length))
                .join(' ');
              console.log(format + ': overall=' + overallCount + ' ' + counts + ' VORP ' + vorpCounts);

              if (overallCount < MIN_OVERALL) {
                failures.push(format + ' overall has ' + overallCount + ' players (need >= ' + MIN_OVERALL + ')');
              }
              for (const [pos, min] of Object.entries(MIN_POSITION)) {
                const count = Array.isArray(positions[pos]) ? positions[pos].length : 0;
                if (count < min) {
                  failures.push(format + ' ' + pos + ' board has ' + count + ' players (need >= ' + min + ')');
                }
              }

              const vorpSource = snapshot.vorpSource;
              if (vorpSource === null || vorpSource === undefined) {
                warnings.push(format + ' VORP source is absent; the snapshot publishes without VORP');
              } else {
                const vorpAsOf = Date.parse(vorpSource?.asOf || '');
                const futureSkewToleranceMs = 5 * 60 * 1000;
                if (vorpSource?.provider !== 'FantasyPros projected VORP') {
                  failures.push(format + ' VORP source provider is missing or invalid');
                }
                if (!Number.isFinite(vorpAsOf) || vorpAsOf > Date.now() + futureSkewToleranceMs) {
                  failures.push(format + ' VORP source asOf is missing, invalid, or future-dated');
                } else {
                  // Age check, same limits as the ADP and best-ball gates. The
                  // VORP fetch retains the previous board on failure with no
                  // maximum age, so without this a silently failing fetch
                  // produces green runs forever. Recorded as vorp_dark rather
                  // than thrown: a stale VORP overlay must not withhold fresh
                  // validated rankings, but the terminal report step turns the
                  // run red so the outage is noticed.
                  const vorpAgeDays = (Date.now() - vorpAsOf) / 86400000;
                  const inDraftSeason = new Date().getUTCMonth() >= 6; // the daily-lane months, July through December, matching isDailyRefreshWindow
                  const vorpWarnLimit = inDraftSeason ? 2 : 8;
                  const vorpFailLimit = inDraftSeason ? 4 : 14;
                  if (vorpAgeDays > vorpFailLimit) {
                    warnings.push(format + ' VORP source is ' + vorpAgeDays.toFixed(1) + ' days old, past the ' + vorpFailLimit + '-day limit; the retained board is stale');
                  } else if (vorpAgeDays > vorpWarnLimit) {
                    console.log('::warning::' + format + ' VORP source is ' + vorpAgeDays.toFixed(1) + ' days old (warn above ' + vorpWarnLimit + ', fail above ' + vorpFailLimit + ')');
                  }
                }
              }

              const snapshotPlayerIds = new Set([
                ...(Array.isArray(snapshot.overall) ? snapshot.overall : []),
                ...Object.values(positions).flatMap((board) => Array.isArray(board) ? board : []),
              ].map((player) => player?.id).filter(Boolean));

              for (const teamSize of VORP_TEAM_SIZES) {
                const entries = snapshot.vorpRankings?.[teamSize];
                const count = Array.isArray(entries) ? entries.length : 0;
                const matchedCount = vorpSource?.matchedCounts?.[teamSize];
                const sourceUrl = vorpSource?.urls?.[teamSize];

                if (entries === undefined && matchedCount === undefined && sourceUrl === undefined) {
                  warnings.push(format + ' ' + teamSize + '-team VORP board is absent; the snapshot publishes without it');
                  continue;
                }
                if (count < MIN_VORP) {
                  failures.push(format + ' ' + teamSize + '-team VORP board has ' + count + ' players (need >= ' + MIN_VORP + ')');
                }
                if (!Number.isInteger(matchedCount) || matchedCount !== count) {
                  failures.push(format + ' ' + teamSize + '-team VORP matchedCount does not equal its board length');
                }

                try {
                  const parsedUrl = new URL(sourceUrl);
                  if (
                    parsedUrl.origin !== 'https://www.fantasypros.com' ||
                    parsedUrl.pathname !== '/nfl/rankings/' + VORP_PATHS[format]
                  ) {
                    failures.push(format + ' ' + teamSize + '-team VORP source URL does not match its scoring format');
                  }
                  const urlTeamSize = parsedUrl.searchParams.get('team_size');
                  if (
                    (teamSize === '12' && urlTeamSize !== null && urlTeamSize !== '12') ||
                    (teamSize !== '12' && urlTeamSize !== teamSize)
                  ) {
                    failures.push(format + ' ' + teamSize + '-team VORP source URL has the wrong league size');
                  }
                } catch {
                  failures.push(format + ' ' + teamSize + '-team VORP source URL is missing or invalid');
                }

                if (!Array.isArray(entries)) continue;
                const playerIds = new Set();
                const ranks = new Set();
                let previousRank = 0;
                let previousValue = Infinity;
                for (const entry of entries) {
                  const rank = entry?.rank;
                  const value = entry?.value;
                  if (typeof entry?.playerId !== 'string' || entry.playerId.length === 0) {
                    failures.push(format + ' ' + teamSize + '-team VORP board contains a missing player ID');
                    break;
                  }
                  if (playerIds.has(entry.playerId)) {
                    failures.push(format + ' ' + teamSize + '-team VORP board contains duplicate player IDs');
                    break;
                  }
                  if (!snapshotPlayerIds.has(entry.playerId)) {
                    failures.push(format + ' ' + teamSize + '-team VORP board contains a player outside the snapshot');
                    break;
                  }
                  if (!Number.isInteger(rank) || rank <= 0 || ranks.has(rank) || rank <= previousRank) {
                    failures.push(format + ' ' + teamSize + '-team VORP ranks are invalid, duplicated, or out of order');
                    break;
                  }
                  if (!Number.isFinite(value) || value < 0 || value > previousValue) {
                    failures.push(format + ' ' + teamSize + '-team VORP values are invalid, negative, or out of order');
                    break;
                  }
                  playerIds.add(entry.playerId);
                  ranks.add(rank);
                  previousRank = rank;
                  previousValue = value;
                }
                if (entries.length > 0 && entries[0]?.rank !== 1) {
                  failures.push(format + ' ' + teamSize + '-team VORP board does not start at rank 1');
                }
              }
            } catch (err) {
              failures.push(format + ' failed to parse: ' + err.message);
            }
          }

          for (const warning of warnings) console.log('::warning::' + warning);
          // Recorded rather than thrown, like adp_dark: an absent VORP board
          // must not skip the redraft commit, but the terminal report step
          // still turns the run red so the outage is noticed.
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'vorp_dark=' + (warnings.length > 0 ? 'true' : 'false') + '\n');
          }

          if (failures.length > 0) {
            console.error('::error::Fantasy snapshot quality gate failed:');
            for (const failure of failures) {
              console.error('::error::  - ' + failure);
            }
            process.exit(1);
          }
          console.log('All scoring formats cleared the overall, position, and VORP checks. Quality gate passed.');
          "

      # Best ball is a soft lane: it has its own upstream sources, so its failures
      # must not skip the redraft commit. This step records the outcome and the
      # terminal check at the end of the job turns it into a red run.
      - name: Verify best ball snapshot quality
        id: verify_best_ball
        if: steps.build_best_ball.outcome == 'success'
        continue-on-error: true
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const DATA_DIR = path.join('public', 'data', 'fantasy');
          const failures = [];

          try {
            const bestBall = JSON.parse(fs.readFileSync(path.join(DATA_DIR, 'best-ball.json'), 'utf8'));
            const playerCount = Array.isArray(bestBall.players) ? bestBall.players.length : 0;
            const rankingExperts = Number(bestBall.rankingSource?.expertCount || 0);
            const adpMatches = Number(bestBall.adpSource?.matchedCount || 0);
            const superflexMatches = Number(bestBall.superflexSource?.matchedCount || 0);
            const scheduleTeams = Object.keys(bestBall.week17Opponents || {}).length;
            const now = Date.now();
            const generatedAgeDays = (now - Date.parse(bestBall.generatedAt || '')) / 86400000;
            // Once the regular season opens the best ball market is closed and the
            // committed board is a dated, frozen snapshot by design (the builder
            // keeps it on a failed refresh, see getBestBallRefreshFallback). Age
            // then reads as a warning, never a failure. Week 1 opens the Wednesday
            // after Labor Day, the same anchor as getNflRegularSeasonWeek in
            // src/lib/fantasyUtils.ts.
            const season = Number(bestBall.season || 0);
            const septFirst = new Date(Date.UTC(season, 8, 1));
            const laborDay = Date.UTC(season, 8, 1 + ((8 - septFirst.getUTCDay()) % 7));
            const seasonOpened = season >= 1920 && now >= laborDay + 2 * 86400000;
            const ageProblems = [];
            // The builder fail-softs each source to the previous snapshot's asOf.
            // Record the failure here without skipping the other lane's commit,
            // using the same age boundaries the deployed tools enforce.
            const inDraftSeason = new Date().getUTCMonth() >= 6; // the daily-lane months, July through December, matching isDailyRefreshWindow
            const sourceWarnLimit = inDraftSeason ? 2 : 8;
            const sourceFailLimit = inDraftSeason ? 4 : 14;
            const futureSkewToleranceDays = 5 / 1440;
            const checkSourceAge = (label, ageDays) => {
              if (!Number.isFinite(ageDays) || ageDays < -futureSkewToleranceDays) {
                failures.push('best-ball ' + label + ' source is invalid or future-dated');
              } else if (ageDays > sourceFailLimit) {
                ageProblems.push('best-ball ' + label + ' source is ' + ageDays.toFixed(1) + ' days old (fail above ' + sourceFailLimit + ' before the season opens)');
              } else if (ageDays > sourceWarnLimit) {
                console.log('::warning::best-ball ' + label + ' source is ' + ageDays.toFixed(1) + ' days old (warn above ' + sourceWarnLimit + ', fail above ' + sourceFailLimit + ')');
              }
            };
            // Provider self-consistency, mirroring assertBestBallConsensusConsistency
            // in src/lib/bestBall/sourceCapabilities.ts: over the top 150 players by
            // published average rank, rank_ecr must sit within 10 places of the same
            // row's published expert range for all but a handful. The four-expert
            // boards of 2026-09-06 and 2026-09-09 cleared the expert floor with 33
            // and 39 offenders, so the floor alone is not a quality gate.
            const players = Array.isArray(bestBall.players) ? bestBall.players : [];
            const finite = (value) => typeof value === 'number' && Number.isFinite(value);
            const divergent = players
              .filter((player) => finite(player.rankAverage))
              .sort((left, right) => left.rankAverage - right.rankAverage || (left.rankEcr || 0) - (right.rankEcr || 0))
              .slice(0, 150)
              .filter((player) => finite(player.rankEcr) && finite(player.minRank) && finite(player.maxRank)
                && (player.rankEcr < player.minRank - 10 || player.rankEcr > player.maxRank + 10));
            const rankingAgeDays = (now - Date.parse(bestBall.rankingSource?.asOf || '')) / 86400000;
            const adpAgeDays = (now - Date.parse(bestBall.adpSource?.asOf || '')) / 86400000;
            const superflexAgeDays = (now - Date.parse(bestBall.superflexSource?.asOf || '')) / 86400000;
            const scheduleAgeDays = (now - Date.parse(bestBall.scheduleSource?.asOf || '')) / 86400000;
            console.log('best-ball: players=' + playerCount + ' experts=' + rankingExperts + ' divergent=' + divergent.length + ' superflex=' + superflexMatches + ' adp=' + adpMatches + ' week17=' + scheduleTeams + ' built=' + generatedAgeDays.toFixed(1) + 'd' + (seasonOpened ? ' (season open, board frozen)' : ''));
            if (playerCount < 250) failures.push('best-ball has ' + playerCount + ' players (need >= 250)');
            if (rankingExperts < 4) failures.push('best-ball has ' + rankingExperts + ' ranking experts (need >= 4)');
            if (divergent.length > 5) failures.push('best-ball consensus disagrees with its own expert ranges on ' + divergent.length + ' of its top 150 players (allow <= 5): ' + divergent.slice(0, 5).map((player) => player.name + ' ECR ' + player.rankEcr + ' vs ' + player.minRank + '-' + player.maxRank).join(', '));
            if (superflexMatches < 150) failures.push('best-ball has ' + superflexMatches + ' Superflex matches (need >= 150)');
            if (adpMatches < 150) failures.push('best-ball has ' + adpMatches + ' ADP matches (need >= 150)');
            if (scheduleTeams < 30) failures.push('best-ball has ' + scheduleTeams + ' Week 17 team mappings (need >= 30)');
            if (!Number.isFinite(generatedAgeDays)) failures.push('best-ball snapshot has no valid generatedAt');
            else if (generatedAgeDays > 10) ageProblems.push('best-ball snapshot was built ' + generatedAgeDays.toFixed(1) + ' days ago (fail above 10 before the season opens)');
            checkSourceAge('rankings', rankingAgeDays);
            checkSourceAge('ADP', adpAgeDays);
            checkSourceAge('Superflex', superflexAgeDays);
            checkSourceAge('schedule', scheduleAgeDays);
            for (const problem of ageProblems) {
              if (seasonOpened) console.log('::warning::' + problem + '; the season has opened and the board is frozen at its dated sources');
              else failures.push(problem);
            }
            if (!String(bestBall.scheduleSource?.url || '').includes('dates=' + bestBall.season)) failures.push('best-ball Week 17 schedule does not match snapshot season');
          } catch (err) {
            failures.push('best-ball failed to parse: ' + err.message);
          }

          if (failures.length > 0) {
            console.error('::error::Best ball snapshot quality gate failed:');
            for (const failure of failures) {
              console.error('::error::  - ' + failure);
            }
            process.exit(1);
          }
          console.log('Best ball snapshot cleared its floors. Quality gate passed.');
          "

      # ADP is a soft signal layered on top of the consensus boards. Its fetch
      # script never fails the run by design, so coverage stays a warning here.
      #
      # Age is different and used to be checked nowhere. resolveAdpFormat retains
      # the previous board with no maximum age, and the retained asOf flows
      # straight into adpSource.asOf, so a multi-day upstream outage produced a
      # fully green run while getFantasyAdpFreshness marked the board stale past
      # four days in draft season and the site hid every ADP surface, including
      # the trade calculator's market anchor. Best ball has checked exactly this
      # for its own sources all along. Age is recorded rather than thrown here so
      # a stale ADP board cannot skip the redraft rankings commit; the terminal
      # check at the end of this job turns it into a red run.
      - name: Check ADP coverage and age
        id: adp_health
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const TOP_BOARD_SIZE = 150;
          const MIN_COVERAGE = 0.9;
          const DATA_DIR = path.join('public', 'data', 'fantasy');
          const formats = ['ppr', 'half_ppr', 'standard'];

          const now = Date.now();
          const inDraftSeason = new Date().getUTCMonth() >= 6; // the daily-lane months, July through December, matching isDailyRefreshWindow
          const ageWarnLimit = inDraftSeason ? 2 : 8;
          const ageFailLimit = inDraftSeason ? 4 : 14;
          const futureSkewToleranceDays = 5 / 1440;
          const darkFormats = [];
          let seasonOpened = false;

          for (const format of formats) {
            try {
              const snapshot = JSON.parse(fs.readFileSync(path.join(DATA_DIR, format + '.json'), 'utf8'));
              // Draft ADP and the draft board stop moving once Week 1 opens
              // (FantasyPros froze its 2026 board at week 0 on 9/10), so from then
              // on their age is a warning, the same rule as the best ball gate.
              const season = Number(snapshot.season || 0);
              const septFirst = new Date(Date.UTC(season, 8, 1));
              const laborDay = Date.UTC(season, 8, 1 + ((8 - septFirst.getUTCDay()) % 7));
              seasonOpened = season >= 1920 && now >= laborDay + 2 * 86400000;
              const topBoard = Array.isArray(snapshot.overall)
                ? snapshot.overall.slice(0, TOP_BOARD_SIZE)
                : [];
              if (!snapshot.adpSource) {
                console.log('::warning::' + format + ' snapshot has no ADP data (adpSource is null). The boards still work; ADP surfaces are hidden.');
                darkFormats.push(format + ' (no adpSource)');
                continue;
              }
              const topBoardMatches = topBoard.filter((player) => Number.isFinite(player.adp)).length;
              const coverage = topBoard.length > 0 ? topBoardMatches / topBoard.length : 0;
              const pct = Math.round(coverage * 100);
              const adpAgeDays = (now - Date.parse(snapshot.adpSource.asOf || '')) / 86400000;
              const ageLabel = Number.isFinite(adpAgeDays) ? adpAgeDays.toFixed(1) + 'd' : 'unparseable asOf';
              console.log(format + ': ADP covered ' + topBoardMatches + ' of the top ' + topBoard.length + ' players (' + pct + '%), asOf ' + snapshot.adpSource.asOf + ' (' + ageLabel + ')');
              if (coverage < MIN_COVERAGE) {
                console.log('::warning::' + format + ' top-board ADP coverage is ' + pct + '%, below the ' + (MIN_COVERAGE * 100) + '% floor. Check the matcher or the upstream feed.');
              }
              if (seasonOpened && adpAgeDays > ageFailLimit) {
                console.log('::warning::' + format + ' ADP source is ' + ageLabel + ' old; the season has opened and draft ADP is frozen at its last reading.');
              } else if (!Number.isFinite(adpAgeDays) || adpAgeDays < -futureSkewToleranceDays || adpAgeDays > ageFailLimit) {
                darkFormats.push(format + ' (' + ageLabel + ')');
              } else if (adpAgeDays > ageWarnLimit) {
                console.log('::warning::' + format + ' ADP source is ' + ageLabel + ' old (warn above ' + ageWarnLimit + ', fail above ' + ageFailLimit + '). The site treats it as stale and hides ADP surfaces.');
              }
            } catch (err) {
              console.log('::warning::' + format + ' ADP coverage check failed to parse the snapshot: ' + err.message);
            }
          }

          if (darkFormats.length > 0) {
            console.error('::error::Redraft ADP is unusable past the ' + ageFailLimit + '-day limit for: ' + darkFormats.join(', '));
          }
          // Guarded: this step must never be the thing that skips the redraft commit.
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'adp_dark=' + (darkFormats.length > 0 ? 'true' : 'false') + '\n');
          }
          "

      # A lane that fails its gates leaves rewritten files in the working tree,
      # and the commit helper dates the sitemap from whatever is on disk. On
      # 2026-09-26 that put a new date on six fantasy routes while the committed
      # rankings were two weeks old. Put the files back before any lane commits.
      - name: Discard redraft artifacts that failed their gates
        if: steps.verify_freshness.outcome != 'success' || steps.verify_quality.outcome != 'success'
        run: |
          git checkout -- \
            src/data/fantasyPositionData.generated.ts \
            src/data/fantasyAdpData.generated.ts \
            src/data/fantasyGameLogData.generated.ts \
            src/data/fantasyVorpData.generated.ts \
            src/data/fantasyRankHistory.generated.json \
            src/data/fantasySnapshotRevision.generated.ts \
            public/data/fantasy/ppr.json \
            public/data/fantasy/half_ppr.json \
            public/data/fantasy/standard.json

      # The weekly board commits first, as it builds first. The commit helper
      # checks `git status --porcelain` itself, which counts untracked files, so
      # the first board of a season (absent from the repo before Week 1) still
      # commits. `git diff --quiet` missed it in 2026 Week 1.
      - name: Commit and push weekly board
        if: steps.build_weekly.outcome == 'success'
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: update fantasy weekly board [automated] [skip ci]" \
            public/data/fantasy/weekly.json

      - name: Commit and push snapshot updates
        if: steps.verify_freshness.outcome == 'success' && steps.verify_quality.outcome == 'success'
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: update fantasy football snapshots [automated] [skip ci]" \
            src/data/fantasyPositionData.generated.ts \
            src/data/fantasyAdpData.generated.ts \
            src/data/fantasyGameLogData.generated.ts \
            src/data/fantasyVorpData.generated.ts \
            src/data/fantasyRankHistory.generated.json \
            src/data/fantasySnapshotRevision.generated.ts \
            public/data/fantasy/ppr.json \
            public/data/fantasy/half_ppr.json \
            public/data/fantasy/standard.json

      # Best ball commits on its own so neither lane can withhold the other's
      # validated data. It only reaches here when its build and its gate both
      # passed; otherwise the report step below turns the run red.
      - name: Commit and push best ball snapshot
        if: steps.verify_best_ball.outcome == 'success'
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: update best ball snapshot [automated] [skip ci]" \
            public/data/fantasy/best-ball.json

      # Both soft lanes report here rather than at the point of failure, so the
      # run still goes red and the failure issue still opens without either lane
      # skipping the other's commit above.
      - name: Report soft-lane failures
        if: >-
          steps.build_redraft.outcome == 'failure' ||
          steps.verify_freshness.outcome == 'failure' ||
          steps.verify_quality.outcome == 'failure' ||
          steps.build_best_ball.outcome == 'failure' ||
          steps.build_weekly.outcome == 'failure' ||
          steps.verify_best_ball.outcome == 'failure' ||
          steps.adp_health.outputs.adp_dark == 'true' ||
          steps.verify_quality.outputs.vorp_dark == 'true'
        run: |
          echo "redraft build:     ${{ steps.build_redraft.outcome }}"
          echo "redraft freshness: ${{ steps.verify_freshness.outcome }}"
          echo "redraft quality:   ${{ steps.verify_quality.outcome }}"
          echo "best ball build:   ${{ steps.build_best_ball.outcome }}"
          echo "weekly build:      ${{ steps.build_weekly.outcome }}"
          echo "best ball gate:    ${{ steps.verify_best_ball.outcome }}"
          echo "redraft ADP dark:  ${{ steps.adp_health.outputs.adp_dark }}"
          echo "redraft VORP dark: ${{ steps.verify_quality.outputs.vorp_dark }}"
          echo "::error::A fantasy refresh gate failed. Each lane committed independently when its own gates passed; see the step outcomes above."
          exit 1

      - name: Notify on failure via GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').open({ github, context }, 'fantasy-refresh-failure', 'Fantasy refresh failed')

      - name: Close resolved failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').close({ github, context }, 'fantasy-refresh-failure')
