name: Update Fantasy Football Snapshots

on:
  # Rankings move daily through draft season. Outside July through September,
  # a weekly pass is enough to catch provider corrections and rollover work.
  schedule:
    - cron: "0 17 * 7-9 *"
    - cron: "0 17 * 1-6,10-12 3"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: update-fantasy
  cancel-in-progress: false

jobs:
  update-fantasy-snapshots:
    name: Update Fantasy Football Snapshots
    runs-on: ubuntu-latest
    # FantasyPros scrape with retries can run long; cap at 30 min.
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build fantasy snapshots
        run: |
          if [[ -z "${FANTASYPROS_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::FANTASYPROS_API_KEY is required for the scheduled fantasy refresh."
            exit 1
          fi
          npm run update:fantasy
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          NODE_ENV: production

      - name: Verify refresh freshness
        run: npx tsx scripts/verifyDataRefresh.ts fantasy-football

      # Quality gate: a partial scrape (e.g. FantasyPros throttling some
      # positions) can produce a snapshot with mostly empty boards and slip
      # past `git diff` because the file does change. Refuse to commit unless
      # every scoring format has a healthy overall board AND every individual
      # position board (QB/RB/WR/TE/K/DST) clears the same room-completeness
      # floor as the source parser. This rejects a coherent partial response
      # before it can replace a draft-ready snapshot.
      - name: Verify fantasy snapshot quality
        id: verify_quality
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const MIN_OVERALL = 300;
          const MIN_POSITION = { QB: 48, RB: 100, WR: 120, TE: 48, K: 32, DST: 32 };
          const DATA_DIR = path.join('public', 'data', 'fantasy');
          const formats = ['ppr', 'half_ppr', 'standard'];
          const failures = [];

          for (const format of formats) {
            const filePath = path.join(DATA_DIR, format + '.json');
            try {
              const snapshot = JSON.parse(fs.readFileSync(filePath, 'utf8'));
              const overallCount = Array.isArray(snapshot.overall) ? snapshot.overall.length : 0;
              const positions = snapshot.positions || {};
              const counts = Object.keys(MIN_POSITION)
                .map((pos) => pos + '=' + ((positions[pos] || []).length))
                .join(' ');
              console.log(format + ': overall=' + overallCount + ' ' + counts);

              if (overallCount < MIN_OVERALL) {
                failures.push(format + ' overall has ' + overallCount + ' players (need >= ' + MIN_OVERALL + ')');
              }
              for (const [pos, min] of Object.entries(MIN_POSITION)) {
                const count = Array.isArray(positions[pos]) ? positions[pos].length : 0;
                if (count < min) {
                  failures.push(format + ' ' + pos + ' board has ' + count + ' players (need >= ' + min + ')');
                }
              }
            } catch (err) {
              failures.push(format + ' failed to parse: ' + err.message);
            }
          }

          try {
            const bestBall = JSON.parse(fs.readFileSync(path.join(DATA_DIR, 'best-ball.json'), 'utf8'));
            const playerCount = Array.isArray(bestBall.players) ? bestBall.players.length : 0;
            const rankingExperts = Number(bestBall.rankingSource?.expertCount || 0);
            const adpMatches = Number(bestBall.adpSource?.matchedCount || 0);
            const superflexMatches = Number(bestBall.superflexSource?.matchedCount || 0);
            const scheduleTeams = Object.keys(bestBall.week17Opponents || {}).length;
            const now = Date.now();
            const generatedAgeDays = (now - Date.parse(bestBall.generatedAt || '')) / 86400000;
            // The builder fail-softs each source to the previous snapshot's asOf,
            // so a single upstream outage must not fail the whole job. Warn at the
            // tight in-season bound, and only fail once a source looks abandoned.
            const inDraftSeason = [6, 7, 8].includes(new Date().getUTCMonth());
            const sourceWarnLimit = inDraftSeason ? 4 : 14;
            const sourceFailLimit = inDraftSeason ? 14 : 45;
            const checkSourceAge = (label, ageDays) => {
              if (!Number.isFinite(ageDays) || ageDays > sourceFailLimit) {
                failures.push('best-ball ' + label + ' source is older than ' + sourceFailLimit + ' days');
              } else if (ageDays > sourceWarnLimit) {
                console.log('::warning::best-ball ' + label + ' source is ' + ageDays.toFixed(1) + ' days old (warn above ' + sourceWarnLimit + ', fail above ' + sourceFailLimit + ')');
              }
            };
            const rankingAgeDays = (now - Date.parse(bestBall.rankingSource?.asOf || '')) / 86400000;
            const adpAgeDays = (now - Date.parse(bestBall.adpSource?.asOf || '')) / 86400000;
            const superflexAgeDays = (now - Date.parse(bestBall.superflexSource?.asOf || '')) / 86400000;
            console.log('best-ball: players=' + playerCount + ' experts=' + rankingExperts + ' superflex=' + superflexMatches + ' adp=' + adpMatches + ' week17=' + scheduleTeams + ' built=' + generatedAgeDays.toFixed(1) + 'd');
            if (playerCount < 250) failures.push('best-ball has ' + playerCount + ' players (need >= 250)');
            if (rankingExperts < 5) failures.push('best-ball has ' + rankingExperts + ' ranking experts (need >= 5)');
            if (superflexMatches < 150) failures.push('best-ball has ' + superflexMatches + ' Superflex matches (need >= 150)');
            if (adpMatches < 150) failures.push('best-ball has ' + adpMatches + ' ADP matches (need >= 150)');
            if (scheduleTeams < 30) failures.push('best-ball has ' + scheduleTeams + ' Week 17 team mappings (need >= 30)');
            if (!Number.isFinite(generatedAgeDays) || generatedAgeDays > 10) failures.push('best-ball snapshot is older than 10 days');
            checkSourceAge('rankings', rankingAgeDays);
            checkSourceAge('ADP', adpAgeDays);
            checkSourceAge('Superflex', superflexAgeDays);
            if (!String(bestBall.scheduleSource?.url || '').includes('dates=' + bestBall.season)) failures.push('best-ball Week 17 schedule does not match snapshot season');
          } catch (err) {
            failures.push('best-ball failed to parse: ' + err.message);
          }

          if (failures.length > 0) {
            console.error('::error::Fantasy snapshot quality gate failed:');
            for (const failure of failures) {
              console.error('::error::  - ' + failure);
            }
            process.exit(1);
          }
          console.log('All scoring formats cleared the overall and per-position floors. Quality gate passed.');
          "

      # ADP is a soft signal layered on top of the consensus boards. Its fetch
      # script never fails the run by design, so check coverage here and warn
      # (never fail) when ADP is missing or matched thinly.
      - name: Check ADP coverage (soft warning)
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const TOP_BOARD_SIZE = 150;
          const MIN_COVERAGE = 0.9;
          const DATA_DIR = path.join('public', 'data', 'fantasy');
          const formats = ['ppr', 'half_ppr', 'standard'];

          for (const format of formats) {
            try {
              const snapshot = JSON.parse(fs.readFileSync(path.join(DATA_DIR, format + '.json'), 'utf8'));
              const topBoard = Array.isArray(snapshot.overall)
                ? snapshot.overall.slice(0, TOP_BOARD_SIZE)
                : [];
              if (!snapshot.adpSource) {
                console.log('::warning::' + format + ' snapshot has no ADP data (adpSource is null). The boards still work; ADP surfaces are hidden.');
                continue;
              }
              const topBoardMatches = topBoard.filter((player) => Number.isFinite(player.adp)).length;
              const coverage = topBoard.length > 0 ? topBoardMatches / topBoard.length : 0;
              const pct = Math.round(coverage * 100);
              console.log(format + ': ADP covered ' + topBoardMatches + ' of the top ' + topBoard.length + ' players (' + pct + '%), asOf ' + snapshot.adpSource.asOf);
              if (coverage < MIN_COVERAGE) {
                console.log('::warning::' + format + ' top-board ADP coverage is ' + pct + '%, below the ' + (MIN_COVERAGE * 100) + '% floor. Check the matcher or the upstream feed.');
              }
            } catch (err) {
              console.log('::warning::' + format + ' ADP coverage check failed to parse the snapshot: ' + err.message);
            }
          }
          "

      - name: Check for snapshot changes
        id: check_changes
        run: |
          if git diff --quiet -- \
            src/data/fantasyPositionData.generated.ts \
            src/data/fantasyAdpData.generated.ts \
            src/data/fantasySnapshotRevision.generated.ts \
            public/data/fantasy/ppr.json \
            public/data/fantasy/half_ppr.json \
            public/data/fantasy/standard.json \
            public/data/fantasy/best-ball.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No fantasy snapshot changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Fantasy snapshot changes detected."
          fi

      - name: Commit and push snapshot updates
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: update fantasy football snapshots [automated] [skip ci]" \
            src/data/fantasyPositionData.generated.ts \
            src/data/fantasyAdpData.generated.ts \
            src/data/fantasySnapshotRevision.generated.ts \
            public/data/fantasy/ppr.json \
            public/data/fantasy/half_ppr.json \
            public/data/fantasy/standard.json \
            public/data/fantasy/best-ball.json

      - name: Create job summary
        if: always()
        run: |
          echo "## Fantasy Football Snapshot Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ **Changes Detected:** public fantasy snapshot artifacts were refreshed and committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ **No Changes:** the published fantasy snapshot artifacts were already current." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Public artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- src/data/fantasyPositionData.generated.ts" >> "$GITHUB_STEP_SUMMARY"
          echo "- src/data/fantasyAdpData.generated.ts" >> "$GITHUB_STEP_SUMMARY"
          echo "- src/data/fantasySnapshotRevision.generated.ts" >> "$GITHUB_STEP_SUMMARY"
          echo "- public/data/fantasy/ppr.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- public/data/fantasy/half_ppr.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- public/data/fantasy/standard.json" >> "$GITHUB_STEP_SUMMARY"
          echo "- public/data/fantasy/best-ball.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure via GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `Fantasy refresh failed ${today}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **Refresh Fantasy Football Snapshots** workflow failed on ${today}.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Commit:** ${context.sha}`,
              `**Trigger:** ${context.eventName}`,
              ``,
              `Check the run logs to diagnose. Common causes:`,
              `- FantasyPros HTML structure changed (\`var ecrData\` extraction failed)`,
              `- Sustained 429s exceeded retry budget`,
              `- Quality gate caught a degraded snapshot (thin overall board or an empty/short position board)`,
              ``,
              `Note: ADP fetch failures are non-fatal by design — they only surface as warnings, never as a failed run.`,
              ``,
              `This issue will be updated if the next run also fails, and auto-closed on the first successful run.`
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fantasy-refresh-failure',
              per_page: 5,
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Failed again on ${today}. Run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['fantasy-refresh-failure', 'automation'],
              });
            }

      - name: Close resolved failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fantasy-refresh-failure',
              per_page: 10,
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Refresh succeeded at ${new Date().toISOString()}. Auto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
