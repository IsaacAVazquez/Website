name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Review writing freshness dates
        env:
          BLOG_DATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:blog-dates -- --base="$BLOG_DATE_BASE"

      - name: Check the automation inventory is current
        run: npm run docs:automation -- --check

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Cache the installed node_modules keyed on the lockfile so warm runs
      # skip `npm ci` entirely (~1-2 min per job across build + e2e shards).
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      # A workflow artifact is immediately available to dependent jobs.
      # The Actions cache can be eventually consistent: the June 16, 2026
      # build jobs saved `.next`, but all dependent E2E jobs missed the cache.
      - name: Archive production build
        run: tar -cf next-build.tar .next

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: next-build-${{ github.sha }}
          path: next-build.tar
          retention-days: 1
          compression-level: 0

  e2e-tests:
    name: E2E Tests (chromium)
    runs-on: ubuntu-latest
    needs: build
    # Shard the spec files across N runners. Bump the matrix length to scale;
    # the run step derives the divisor from `strategy.job-total`, so adding a
    # shard number here is the only change needed.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Reuse the exact production build produced by the required `build` job.
      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: next-build-${{ github.sha }}

      - name: Extract production build
        run: tar -xf next-build.tar

      # Cache Playwright browser binaries (~hundreds of MB) keyed on the
      # @playwright/test version pinned in package-lock.json.
      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}-chromium

      - name: Install Playwright browsers (chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  # Run the full browser matrix only on pushes to main (not on every PR).
  # Catches Safari/Firefox-specific regressions without slowing down PR feedback.
  e2e-tests-full-matrix:
    name: E2E Tests (full matrix)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Allow the failure-notification step to open/update a tracking issue.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: next-build-${{ github.sha }}

      - name: Extract production build
        run: tar -xf next-build.tar

      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}-full

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run E2E tests (full matrix)
        run: npm run test:e2e:full

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-full-matrix
          path: playwright-report/
          retention-days: 14

      # The full matrix runs post-merge only, so a WebKit/Firefox regression
      # otherwise turns main red with no signal to act. File (or update) a
      # tracking issue on failure, mirroring the data-refresh workflows.
      - name: Notify on failure via GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').open({ github, context }, 'e2e-matrix-failure', 'E2E full matrix (WebKit / Firefox) failing on main')

      - name: Close resolved failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').close({ github, context }, 'e2e-matrix-failure')

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
