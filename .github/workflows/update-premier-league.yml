name: Refresh Premier League Snapshot

on:
  schedule:
    # Every four hours during the PL season (Aug through May). Skipped Jun/Jul
    # because the league is on summer break — no fixtures, no standings
    # changes, so the daily run would just burn minutes.
    - cron: "15 */4 * 1-5,8-12 *"
  workflow_dispatch:

# Both football lanes draw on one football-data.org token and its limit of
# 10 requests a minute. Run side by side they took each other's budget, and
# most runs skipped a club or lost the table. One group makes them take turns.
concurrency:
  group: football-data-org
  cancel-in-progress: false

jobs:
  refresh-premier-league:
    name: Refresh Premier League Snapshot
    runs-on: ubuntu-latest
    # Cap a hung football-data.org call so we don't burn 6 hours of runner.
    timeout-minutes: 30

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Refresh Premier League snapshot
        timeout-minutes: 20
        run: npm run update:premier-league
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          NODE_ENV: production

      - name: Verify refresh freshness and quality
        run: npx tsx scripts/verifyDataRefresh.ts premier-league

      - name: Check for snapshot changes
        id: check_changes
        run: |
          if [ -z "$(git status --porcelain -- src/data/premierLeagueSnapshot.ts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in src/data/premierLeagueSnapshot.ts"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in src/data/premierLeagueSnapshot.ts"
          fi

      - name: Commit and push refreshed snapshot
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: refresh premier league snapshot [automated] [skip ci]" \
            src/data/premierLeagueSnapshot.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create job summary
        if: always()
        run: |
          echo "## Premier League Snapshot Refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "**Schedule:** Every four hours, August through May" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.verify_quality.outputs.standings_count }}" ]; then
            echo "**Teams in standings:** ${{ steps.verify_quality.outputs.standings_count }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Team snapshots:** ${{ steps.verify_quality.outputs.team_snapshots }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
            echo "✅ Premier League snapshot changed and was committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Premier League snapshot was already up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify on failure via GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').open({ github, context }, 'premier-league-refresh-failure', 'Premier League refresh failed')

      - name: Close resolved failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').close({ github, context }, 'premier-league-refresh-failure')
