name: Refresh Golf Snapshot

on:
  # Tournament rounds move quickly Thursday through Sunday, so refresh every
  # three hours then and once daily on quieter weekdays.
  schedule:
    - cron: "40 */3 * * 0,4-6"
    - cron: "40 8 * * 1-3"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: refresh-golf
  cancel-in-progress: false

jobs:
  refresh-golf:
    name: Refresh Golf Snapshot
    uses: ./.github/workflows/refresh-snapshot.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      id: golf
      snapshot-path: src/data/golfSnapshot.json
      label: golf-refresh-failure
      title: Golf refresh failed
