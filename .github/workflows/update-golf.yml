name: Refresh Golf Snapshot

on:
  # Tournament rounds move quickly Thursday through Sunday, so refresh every
  # three hours then and once daily on quieter weekdays.
  schedule:
    - cron: "40 */3 * * 0,4-6"
    - cron: "40 8 * * 1-3"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: refresh-golf
  cancel-in-progress: false

jobs:
  refresh-golf:
    name: Refresh Golf Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Refresh golf snapshot
        timeout-minutes: 12
        run: npm run update:golf
        env:
          NODE_ENV: production

      - name: Verify refresh freshness and quality
        run: npx tsx scripts/verifyDataRefresh.ts golf

      - name: Commit and push refreshed snapshot
        id: commit
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: refresh golf snapshot [automated] [skip ci]" \
            src/data/golfSnapshot.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure via GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').open({ github, context }, 'golf-refresh-failure', 'Golf refresh failed')

      - name: Close resolved failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').close({ github, context }, 'golf-refresh-failure')
