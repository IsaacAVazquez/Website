name: Refresh NBA Snapshot

on:
  # Every four hours during the NBA season and playoffs. October starts mid-month
  # to avoid failing before ESPN has regular-season leaders populated.
  schedule:
    - cron: "20 */4 15-31 10 *"
    - cron: "20 */4 * 1-6,11-12 *"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: refresh-nba
  cancel-in-progress: false

jobs:
  refresh-nba:
    name: Refresh NBA Snapshot
    uses: ./.github/workflows/refresh-snapshot.yml
    secrets: inherit
    permissions:
      contents: write
      issues: write
    with:
      id: nba
      snapshot-path: src/data/nbaSnapshot.json
      label: nba-refresh-failure
      title: NBA refresh failed
