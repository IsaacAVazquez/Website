name: Refresh NBA Snapshot

on:
  # Every four hours during the NBA season and playoffs. October starts mid-month
  # to avoid failing before ESPN has regular-season leaders populated.
  schedule:
    - cron: "20 */4 15-31 10 *"
    - cron: "20 */4 * 1-6,11-12 *"
  workflow_dispatch:

# Don't stack a manual dispatch on top of a scheduled run.
concurrency:
  group: refresh-nba
  cancel-in-progress: false

jobs:
  refresh-nba:
    name: Refresh NBA Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Refresh NBA snapshot
        timeout-minutes: 12
        run: npm run update:nba
        env:
          NODE_ENV: production

      - name: Verify refresh freshness and quality
        run: npx tsx scripts/verifyDataRefresh.ts nba

      - name: Commit and push refreshed snapshot
        id: commit
        run: |
          bash scripts/ci/commit-and-push-snapshot.sh \
            "chore: refresh nba snapshot [automated] [skip ci]" \
            src/data/nbaSnapshot.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure via GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').open({ github, context }, 'nba-refresh-failure', 'NBA refresh failed')

      - name: Close resolved failure issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: await require('./scripts/ci/failure-issue.cjs').close({ github, context }, 'nba-refresh-failure')
