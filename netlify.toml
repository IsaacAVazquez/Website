[build]
  command = "npm run build && rm -rf .next/standalone/*/public/data node_modules/@img node_modules/sharp"
  publish = ".next"
  # Decides which git-triggered builds Netlify runs at all. Production and
  # dependabot previews are skipped; see the script for why.
  ignore = "sh scripts/ci/netlify-ignore.sh"
  
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = ".netlify/deploy/v1/blobs/**,.netlify/edge-functions/**,.netlify/functions-internal/**,.next/**"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_USERNAME,ADMIN_PASSWORD,NEXTAUTH_SECRET,CRON_SECRET"

[functions]
  directory = "netlify/functions"
  # Investment APIs read committed snapshots from the filesystem. The Next.js
  # standalone bundle intentionally omits public assets, so include this data
  # explicitly instead of relying on a server-side fetch back into the deploy.
  included_files = ["public/data/investments/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables - set these in Netlify dashboard:
# NEXTAUTH_URL = "https://your-domain.com"
# NEXTAUTH_SECRET = "your-nextauth-secret-here"
# ADMIN_USERNAME = "your-admin-username"
# ADMIN_PASSWORD = "your-admin-password"
# Fantasy snapshot refreshes run in GitHub Actions from public rankings pages.
# The deployed Netlify runtime does not need FANTASYPROS_API_KEY.
# CRON_SECRET = "your-cron-secret-here"

# CSS files — explicit MIME type prevents text/plain serving on Netlify
[[headers]]
  for = "/_next/static/css/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# JS chunk files — explicit MIME type
[[headers]]
  for = "/_next/static/chunks/**"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# All other hashed static assets (fonts, images, media, etc.)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/investments/**"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Netlify-CDN-Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
